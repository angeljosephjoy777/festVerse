<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Dashboard — FestVerse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid-bg"></div><div class="cursor-glow"></div>
<div id="loader"><div class="orbit"><span></span><span></span><span></span></div></div>

<div class="dash">
  <aside class="side">
    <a class="brand" href="index.html"><span class="logo">✦</span>FestVerse</a>
    <a class="nv on" data-s="events"><i class="bi bi-compass"></i><span>Discover</span></a>
    <a class="nv" data-s="mine"><i class="bi bi-ticket-perforated"></i><span>My tickets</span></a>
    <a class="nv" data-s="profile"><i class="bi bi-person"></i><span>Profile</span></a>
    <a class="nv" id="logout" role="button"><i class="bi bi-box-arrow-left"></i><span>Logout</span></a>
    <div class="me glass"><div class="avatar" id="av">A</div><div class="overflow-hidden"><div class="fw-semibold text-truncate" id="meName">—</div><small class="muted text-truncate d-block" id="meRoll">—</small></div></div>
  </aside>

  <main class="main">
    <div class="mobile-top"><a class="brand" href="index.html"><span class="logo">✦</span>FestVerse</a><div class="avatar" id="av2">A</div></div>

    <!-- DISCOVER -->
    <section class="sec on" id="sec-events">
      <div class="page-head"><div><h2>Hey <span class="grad-text" id="hello">there</span> 👋</h2><span class="muted">Find something worth showing up for.</span></div></div>
      <div class="row g-3 mb-4">
        <div class="col-4"><div class="glass kpi" style="--k:var(--p)"><div class="ic"><i class="bi bi-ticket-perforated"></i></div><h3 id="kReg">0</h3><small class="muted">Registered</small></div></div>
        <div class="col-4"><div class="glass kpi" style="--k:var(--pk)"><div class="ic"><i class="bi bi-lightning-charge"></i></div><h3 id="kUp">0</h3><small class="muted">Upcoming</small></div></div>
        <div class="col-4"><div class="glass kpi" style="--k:var(--tl)"><div class="ic"><i class="bi bi-grid"></i></div><h3 id="kOpen">0</h3><small class="muted">Open events</small></div></div>
      </div>
      <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
        <div class="search flex-grow-1" style="max-width:360px"><i class="bi bi-search"></i><input id="q" class="form-control" placeholder="Search events or venues"></div>
        <div class="d-flex flex-wrap gap-2" id="chips"></div>
      </div>
      <div class="row g-4" id="evGrid"></div>
    </section>

    <!-- TICKETS -->
    <section class="sec" id="sec-mine">
      <div class="page-head"><h2>My <span class="grad-text">tickets</span></h2></div>
      <div class="row g-4" id="tickets"></div>
    </section>

    <!-- PROFILE -->
    <section class="sec" id="sec-profile">
      <div class="page-head"><h2>My <span class="grad-text">profile</span></h2></div>
      <div class="glass p-4" style="max-width:720px">
        <form id="pf" novalidate><div class="row g-x-2">
          <div class="col-md-6"><div class="field"><label>Email (locked)</label><input id="pEmail" class="form-control" disabled></div></div>
          <div class="col-md-6"><div class="field"><label>Roll number (locked)</label><input id="pRoll" class="form-control" disabled></div></div>
          <div class="col-md-6"><div class="field"><label for="pName">Full name</label><input id="pName" class="form-control"><div class="fb"></div></div></div>
          <div class="col-md-6"><div class="field"><label for="pPhone">Mobile</label><input id="pPhone" class="form-control" maxlength="10" inputmode="numeric"><div class="fb"></div></div></div>
          <div class="col-md-6"><div class="field"><label for="pBranch">Branch</label><select id="pBranch" class="form-select"></select><div class="fb"></div></div></div>
          <div class="col-md-6"><div class="field"><label for="pYear">Year</label><select id="pYear" class="form-select"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select><div class="fb"></div></div></div>
        </div><button class="btn-fx" id="pSave" type="submit">Save changes</button></form>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/student.js"></script>
</body>
</html>
