<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — FestVerse 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid-bg"></div><div class="cursor-glow"></div>
<div id="loader"><div class="orbit"><span></span><span></span><span></span></div></div>

<nav class="nav-fx glass"><a class="brand" href="index.html"><span class="logo">✦</span>FestVerse</a>
  <div class="nav-links"><a class="l" href="index.html"><i class="bi bi-arrow-left"></i> Home</a></div></nav>

<div class="auth-wrap">
  <div class="auth-art">
    <div class="orb"></div>
    <span class="chip mb-3" style="width:fit-content">FestVerse 2026</span>
    <h2>Welcome <span class="grad-text">back.</span></h2>
    <p class="muted fs-5 mt-3" style="max-width:420px">Your tickets, your events, your fest — right where you left them.</p>
  </div>
  <div class="auth-form">
    <div class="auth-card glass reveal">
      <div class="seg" id="seg"><span class="thumb"></span>
        <button type="button" data-r="student" class="on"><i class="bi bi-mortarboard"></i> Student</button>
        <button type="button" data-r="admin"><i class="bi bi-shield-lock"></i> Admin</button>
      </div>
      <h3 class="mb-1" id="ttl">Student login</h3>
      <p class="muted mb-4" id="sub">Sign in to browse and register for events.</p>
      <div id="msg" class="alert-fx"></div>
      <form id="f" novalidate>
        <div class="field"><label for="email">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@college.edu" autocomplete="email"><div class="fb"></div></div>
        <div class="field"><label for="pw">Password</label>
          <input id="pw" type="password" class="form-control" placeholder="Your password" autocomplete="current-password">
          <button type="button" class="eye" data-target="pw"><i class="bi bi-eye"></i></button><div class="fb"></div></div>
        <div class="text-end mb-3"><a href="#" id="forgot" class="muted small">Forgot password?</a></div>
        <button class="btn-fx w-100" id="go" type="submit">Login</button>
      </form>
      <p class="muted text-center mt-4 mb-0" id="alt">New here? <a href="signup.html" class="grad-text fw-semibold">Create a student account</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
